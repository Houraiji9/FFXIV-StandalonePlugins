name: Build and package
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'pluginmaster.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Download pinned Dalamud API 15 references
        shell: pwsh
        run: ./scripts/Get-DalamudSdk.ps1
      - name: Build and test
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Package
        shell: pwsh
        env:
          BUILD_REF: ${{ github.ref_name }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REPOSITORY: ${{ github.repository }}
        run: |
          $version = [Version](Get-Content plugins/BatchTrade/BatchTrade.json -Raw | ConvertFrom-Json).AssemblyVersion
          $tag = if ($env:BUILD_REF_TYPE -eq 'tag') { $env:BUILD_REF } elseif ($version.Revision -gt 0) { 'v' + $version.ToString() } else { 'v' + $version.ToString(3) }
          ./scripts/Package.ps1 -Tag $tag -Repository $env:BUILD_REPOSITORY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-packages
          path: |
            artifacts/*.zip
            artifacts/pluginmaster.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
